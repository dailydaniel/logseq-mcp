# Example logseq-mcp config.
# Copy to ~/.config/logseq-mcp/config.toml (or point LOGSEQ_MCP_CONFIG at it).
# Token and URL come from the environment (LOGSEQ_API_TOKEN / LOGSEQ_API_URL),
# never from this file. Every section is optional — with no config file at all
# the server runs on safe defaults.

[read]
resolve_depth = 2          # 0 = don't expand ((uuid)); page-refs always -> name

[write]
allow_agents_write_any = false
agent_write_prefix = "byAgent"   # the agent may only write under byAgent/

[search]
files_path = ""            # e.g. "/Users/you/LifeGraph"; empty = file-search off

[blacklist]
pages = ["apikey"]         # page + its subpages hidden; [[apikey]] mentions redacted

[tasks]
allow_status_change = false

[audit_log]
enabled = false

# Worklog channel: add_journal_note() appends "HH:MM <text>" to TODAY's journal,
# nested under its project group and, optionally, a ((ref)) to a task block.
# This is the only channel that writes outside agent_write_prefix, so it is
# append-only, confined to today's journal, and everything it creates lives
# under root_block. Off unless enabled.
[worklog]
enabled = false
# Page namespace whose DIRECT children are the projects a note may be filed
# under: "_work" admits _work/dynamo but never _work/dynamo/sync.
namespace = "_work"
# The single daily container the channel owns. Keeping its own root is what
# stops it from appending into hand-written #_work/... blocks elsewhere in the
# journal (a week plan, say).
root_block = "#_worklog"
# Direct children that are not projects (archive roots, retired work) — the
# depth filter alone would let these through.
exclude = ["archive"]
# Agents allowed to sign a note are pages exactly TWO levels below this
# namespace: <runtime>/<name> (byAgent/claude/work-scout, byAgent/codex/macbook).
# Any runtime qualifies — adding one needs no config. Content namespaces at that
# same depth must be excluded, or every page in them becomes a valid signature.
agent_namespace = "byAgent"
agent_exclude = ["readingList", "projects"]

# --- custom queries ---

# advanced query as a self-contained EDN map (its own :rules and :inputs)
[queries.week_plan]
description = "Latest week-plan items (blocks)"
file = "queries/week_plan.edn"
register_as_tool = true
resolve_block_refs = true

# advanced query that reuses a shared rules file
[queries.frisbee_tasks]
description = "Open tasks under #_work/frisbee"
file = "queries/frisbee_tasks.edn"
rules = "rules/common.edn"
register_as_tool = true

# short simple query inline (no file needed)
[queries.now]
description = "NOW priority-A tasks"
query = "(and (todo NOW) (priority A))"
